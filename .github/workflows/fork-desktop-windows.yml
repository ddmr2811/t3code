name: Fork desktop (Windows x64)

# Fork: builds the unsigned Windows x64 desktop installer on free GitHub
# runners. A `fork-desktop-<x.y.z>-<n>` tag also publishes it as the GitHub
# release `v<version>`, marked Latest, which installed apps update from: the
# build's update feed is this repository's releases. A manual run only builds,
# with the installer plus SHA256SUMS as the `fork-desktop-windows-x64` artifact.
# No secret is passed, so the packaging jobs skip signing, and the installed
# app then skips electron-updater's publisher check (it has no publisherName).
# Packaging is release.yml's: release-desktop.yml for Windows, and for Linux
# x64 because the Windows app embeds that job's CLI archive as its WSL runtime.
on:
  push:
    tags:
      - "fork-desktop-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (x.y.z). Defaults to apps/desktop/package.json."
        required: false
        type: string

permissions:
  # The Windows job reads this run's artifact list to wait for the Linux CLI archive.
  actions: read
  contents: read

concurrency:
  group: fork-desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_bundle:
    name: Build JS bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.config.outputs.version }}
      clerk_publishable_key: ${{ steps.config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.config.outputs.relay_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # A plain x.y.z keeps the production branding and the GitHub update feed;
      # nightly and preview versions change both. The T3 Connect ids are the
      # public ones in .env.example, as upstream preview builds use.
      # The updater only moves to a higher semver, so tag `fork-desktop-x.y.z-n`
      # builds x.y.(z*100+n), n in 1-99: 0.1.9-3 is 0.1.903, above 0.1.9, and a
      # fork of 0.1.10 starts at 0.1.1001. A prerelease such as 0.1.9-fork.3
      # sorts below 0.1.9, and build metadata (+fork.3) does not sort at all.
      - name: Resolve version and public config
        id: config
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^fork-desktop-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-([1-9][0-9]?)$ ]]; then
              echo "Tag must be fork-desktop-<x.y.z>-<n> with n from 1 to 99, got '$GITHUB_REF_NAME'" >&2
              exit 1
            fi
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] * 100 + BASH_REMATCH[4]))"
          else
            version="${INPUT_VERSION:-$(jq -r .version apps/desktop/package.json)}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must be x.y.z, got '$version'" >&2; exit 1; }
          env_example() { sed -n "s|^T3CODE_$1=||p" .env.example; }
          {
            echo "version=$version"
            echo "clerk_publishable_key=$(env_example CLERK_PUBLISHABLE_KEY)"
            echo "clerk_jwt_template=$(env_example CLERK_JWT_TEMPLATE)"
            echo "clerk_cli_oauth_client_id=$(env_example CLERK_CLI_OAUTH_CLIENT_ID)"
            echo "relay_url=$(env_example RELAY_URL)"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ steps.config.outputs.version }}"

      - name: Build JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ steps.config.outputs.clerk_publishable_key }}
          T3CODE_CLERK_JWT_TEMPLATE: ${{ steps.config.outputs.clerk_jwt_template }}
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ steps.config.outputs.clerk_cli_oauth_client_id }}
          T3CODE_RELAY_URL: ${{ steps.config.outputs.relay_url }}
        run: vp run build:desktop:bundle

      # Same layout as release.yml's js-bundle, which release-desktop.yml restores.
      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # Only its `cli-linux-x64` archive is used. The Windows job waits for a job
  # whose name ends in "Build Linux x64", which this label produces.
  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.build_bundle.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.build_bundle.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.build_bundle.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.build_bundle.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.build_bundle.outputs.relay_url }}
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true

  desktop_win_x64:
    name: Desktop Windows x64
    needs: [build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.build_bundle.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.build_bundle.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.build_bundle.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.build_bundle.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.build_bundle.outputs.relay_url }}
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      # The Linux job installs the same filters on the same runner and saves it.
      save_pnpm_store: false

  installer:
    name: Collect installer
    needs: [desktop_win_x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-win-x64
          path: desktop-win-x64

      - name: Write checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir installer
          cp desktop-win-x64/*.exe installer/
          cd installer && sha256sum *.exe > SHA256SUMS && cat SHA256SUMS

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-desktop-windows-x64
          path: installer/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  # Tag runs only. electron-updater reads /releases/latest, then that release's
  # latest.yml, which names the installer and its blockmap.
  publish:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [build_bundle, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-desktop-windows-x64
          path: release

      - name: Download Windows build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-win-x64
          path: desktop-win-x64

      # release-desktop.yml suffixes the feed with its arch for release.yml's
      # merge; with only x64 there is nothing to merge.
      - name: Stage update feed
        shell: bash
        env:
          VERSION: ${{ needs.build_bundle.outputs.version }}
        run: |
          set -euo pipefail
          cp desktop-win-x64/*.blockmap release/
          cp desktop-win-x64/latest-win-x64.yml release/latest.yml
          grep -qx "version: $VERSION" release/latest.yml || { echo "latest.yml is not version $VERSION" >&2; cat release/latest.yml >&2; exit 1; }
          ls -l release

      # The tag is created through the API with this token, so it starts no
      # workflow (release.yml listens for v*.*.* pushes). A rerun replaces the
      # assets, the feed last, so it never names an installer not yet uploaded.
      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build_bundle.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" release/*.exe release/*.blockmap release/SHA256SUMS --clobber
            gh release upload "$tag" release/latest.yml --clobber
            gh release edit "$tag" --draft=false --prerelease=false --latest
          else
            gh release create "$tag" release/* \
              --target "$GITHUB_SHA" \
              --title "T3 Code Fork $VERSION" \
              --notes "Windows x64 build of \`$GITHUB_REF_NAME\` ($GITHUB_SHA), unsigned." \
              --latest
          fi
