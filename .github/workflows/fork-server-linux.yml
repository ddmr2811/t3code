name: Fork server (Linux x64)

# Fork: builds the same self-contained server archive that the upstream release
# attaches (`t3-<version>-linux-x64.tar.gz`), on a free GitHub runner, so a
# Linux machine can run the fork's server. Push a `fork-server-<version>-<n>`
# tag to build that commit; the archive is the run's artifact.
on:
  push:
    tags:
      - "fork-server-*"

permissions:
  contents: read

concurrency:
  group: fork-server-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Linux x64 server archive
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUST_TARGET: x86_64-unknown-linux-gnu
      T3CODE_TELEMETRY_CHANNEL: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # `fork-server-0.1.9-2` builds version 0.1.9. The version must match the
      # `t3` launcher installed on the machine, which looks for that folder.
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#fork-server-}"
          version="${version%-*}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must be fork-server-<x.y.z>-<n>, got $GITHUB_REF_NAME" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ env.RUST_TARGET }}

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ steps.version.outputs.version }}"

      - name: Build JS bundle
        run: vp run build:desktop:bundle

      - name: Build resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "$RUST_TARGET"

      - name: Apply web client branding
        run: node scripts/apply-web-brand-assets.ts production apps/server/dist/client

      - name: Build server single-executable
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Stage resource monitor
        shell: bash
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          mkdir -p "$target_dir"
          cp "native/resource-monitor/target/$RUST_TARGET/release/t3-resource-monitor" "$target_dir/t3-resource-monitor"

      - name: Install patchelf
        shell: bash
        run: command -v patchelf || { sudo apt-get update && sudo apt-get install -y patchelf; }

      - name: Build archive
        run: |
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version "${{ steps.version.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ steps.version.outputs.version }}"

      - name: Write checksum
        shell: bash
        run: cd release-cli && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-server-linux-x64
          path: release-cli/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
